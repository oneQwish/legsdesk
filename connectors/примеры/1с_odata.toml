# =============================================================================================
# ПРИМЕР: дела напрямую из 1С через стандартный интерфейс OData.
#
# Что нужно сделать в 1С (один раз):
#   1. Опубликовать информационную базу на веб-сервере (Конфигуратор → Администрирование → Публикация
#      на веб-сервере), отметить «Публиковать стандартный интерфейс OData».
#   2. Разрешить нужные объекты для OData: обработкой «Настройка автоматического REST-сервиса» или
#      методом УстановитьСоставСтандартногоИнтерфейсаOData(...) — например, справочник судебных дел.
#   3. Завести пользователя 1С только с правом чтения этих объектов; пароль — в переменной окружения.
# Проверка в браузере: http://сервер/база/odata/standard.odata/ — должен открыться список объектов.
# Имена объектов OData: Catalog_Имя, Document_Имя, InformationRegister_Имя …
# Поля табличных частей и ссылки — через точку: {Суд.Description}, если в expand указано "Суд".
# =============================================================================================

[connector]
name = "1С: судебные дела (OData)"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "in"

[source]
type = "odata"
url = "http://srv-1c/ura/odata/standard.odata"   # адрес публикации + /odata/standard.odata
entity = "Catalog_СудебныеДела"                   # имя объекта в OData (уточните у себя)
user = "lawdesk_reader"
password_env = "LAWDESK_1C_PASSWORD"              # пароль не пишем в файл — только в переменную окружения
select = "Ref_Key,Code,УИД,НомерДела,Суд_Key,ЗаявленнаяСумма,Судья,ДатаРешения,DeletionMark"
expand = "Суд"
filter = "DeletionMark eq false"
page_size = 1000                                  # 1С отдаёт порциями — не больше 1000–5000 за раз

[cases]
uid = "{УИД}"
court_code = "{Суд.Code}"
court_name = "{Суд.Description}"
case_number = "{НомерДела|trim}"

[observations]
source = "1С"
source_ref = "{Ref_Key}"                          # уникальная ссылка объекта 1С

[observations.fields]
judge = "{Судья}"
claim_total = "{ЗаявленнаяСумма|money}"
decision_date = "{ДатаРешения|date}"              # пустая дата 1С (0001-01-01) пропускается сама
