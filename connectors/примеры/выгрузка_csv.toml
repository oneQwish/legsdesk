# =============================================================================================
# ПРИМЕР (наружу): решения юристов → CSV-файл для загрузки в 1С или любую другую систему.
#
# Программа читает «ленту изменений» рабочего места с того места, где остановилась в прошлый раз
# (запоминает в state_file), и дописывает новые строки. Повторный запуск не дублирует строки.
# Ключу нужна область export.
#
# Что можно подставлять в колонки:
#   {case.uid} {case.court_code} {case.court_name} {case.case_number} {case.legal_entity} {case.responsible} …
#   {field} — ключ поля, {field_label} — его название, {value} — новое значение, {previous} — прежнее,
#   {note} — комментарий юриста, {chosen} — какой источник выбран, {actor} — кто, {ts} — когда,
#   {date} — дата события, {action} — вид события, {id}/{feed_seq} — номер события.
# =============================================================================================

[connector]
name = "Решения юристов → CSV"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "out"

[feed]
actions = ["value_resolved"]             # какие события выгружать (список — docs/коннекторы.md)
state_file = "состояние/решения_csv.курсор"

[sink]
type = "csv"
path = "выгрузки/решения_{date}.csv"     # {date} — дата и время запуска; без {date} — один файл, дописывается
mode = "new"                             # new — новый файл каждый раз; append — дописывать в один файл
encoding = "utf-8-sig"                   # 1С и Excel открывают такой файл без «кракозябр»
delimiter = ";"

[sink.columns]                           # слева — заголовок колонки в файле, справа — что подставить
"УИД" = "{case.uid}"
"Код суда" = "{case.court_code}"
"Номер дела" = "{case.case_number}"
"Поле" = "{field_label}"
"Ключ поля" = "{field}"
"Значение" = "{value}"
"Было" = "{previous}"
"Выбран источник" = "{chosen}"
"Комментарий" = "{note}"
"Юрист" = "{actor}"
"Когда" = "{ts}"
