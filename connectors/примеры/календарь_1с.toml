# =============================================================================================
# ПРИМЕР: производственный календарь прямо из 1С через OData
# (регистр сведений «Данные производственного календаря» — в БСП/ЗУП/Бухгалтерии он есть;
#  точное имя объекта посмотрите по адресу …/odata/standard.odata/).
# =============================================================================================

[connector]
name = "1С: производственный календарь (OData)"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "in"

[source]
type = "odata"
url = "http://srv-1c/ura/odata/standard.odata"
entity = "InformationRegister_ДанныеПроизводственногоКалендаря"
user = "lawdesk_reader"
password_env = "LAWDESK_1C_PASSWORD"
filter = "Год eq 2027"
select = "Дата,ВидДня"

[calendar]
date = "{Дата|date}"
day_type = "{ВидДня}"
nonworking_values = ["Суббота", "Воскресенье", "Праздник", "Нерабочий"]
source_name = "1С: регламентированный календарь"
