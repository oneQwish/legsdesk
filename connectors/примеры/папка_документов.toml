# =============================================================================================
# ПРИМЕР: загрузить файлы из папки (сканы, PDF-оригиналы писем, документы ФССП) и привязать к делам.
#
# Для каждого файла программа знает: {файл} {имя} {расширение} {папка} {путь} {размер} {sha256}.
# Остальное — из «файла-спутника»: рядом с «решение.pdf» положите «решение.pdf.json» (или «решение.json»):
#   {"уид": "50RS…", "вид": "решение", "дата": "15.03.2027", "мотивированное": "22.03.2027"}
# Повторный запуск безопасен: одинаковые файлы (по sha256) не задваиваются.
# =============================================================================================

[connector]
name = "Папка с документами"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "in"

[source]
type = "folder"
path = "данные/документы"
pattern = "*.pdf"                        # какие файлы брать
recursive = true                         # заходить ли во вложенные папки

[documents]
file = "{путь}"                          # что загружать (указать — значит загрузить сам файл в хранилище)
filename = "{файл}"
kind = "{тип|default:скан}"
act_type = "{вид}"
act_date = "{дата|date}"
motivated_date = "{мотивированное|date}"
track_no = "{трек|default:}"
# signature_file = "{папка}/{имя}.sig"   # открепленная подпись рядом с файлом

[documents.case]                         # к какому делу привязать
uid = "{уид}"
