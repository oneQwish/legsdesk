# =============================================================================================
# ПРИМЕР: JSON-файл (выгрузка из любой системы). Вложенные поля — через точку: {суд.код}.
# =============================================================================================

[connector]
name = "JSON-выгрузка"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "in"

[source]
type = "json"
path = "данные/дела.json"
items_path = "дела"                      # где в файле список записей; пусто — весь файл и есть список

[cases]
uid = "{уид}"
court_code = "{суд.код}"
court_name = "{суд.название}"
case_number = "{номер}"

[observations]
source = "внешняя система"
source_ref = "{ид}"

[observations.fields]
judge = "{судья}"
