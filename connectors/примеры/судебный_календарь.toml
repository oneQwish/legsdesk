# ================================================================================================
#  Заседания из «Судебного календаря» (rasp.gslegalteam.ru) → рабочее место юриста
# ================================================================================================
#  Только ЧТЕНИЕ: коннектор входит в календарь и забирает выгрузку всех заседаний (GET /api/export).
#  В самом календаре ничего не меняется. Запускать раз в 15–30 минут (запуск.bat / запуск.sh).
#
#  Логин и пароль календаря — НЕ здесь, а в секреты.bat / секреты.sh:
#      set SK_LOGIN=…            (Windows)        export SK_LOGIN=…        (Linux)
#      set SK_PASSWORD=…                          export SK_PASSWORD=…
#  Учётной записи коннектора достаточно права просмотра. В календаре нет роли «только чтение» —
#  заведите отдельного сотрудника для коннектора и храните его пароль только в секретах.
#
#  Как работает привязка: из поля «дело» («2-1234/2025, беседа») берутся номера дел и ищутся в реестре.
#  Нашлось одно дело — заседание привязано; нет или несколько — «Заседания» → «Без дела», привязать вручную
#  (ручная привязка сохраняется при следующих запусках).
# ================================================================================================

[connector]
name = "Судебный календарь"
api_url = "http://127.0.0.1:8000"          # адрес рабочего места (LAWDESK_URL из секретов главнее)
direction = "in"

[source]
type = "http_json"
url = "https://rasp.gslegalteam.ru/api/export"
items_path = "records"
login_url = "https://rasp.gslegalteam.ru/api/login"
timeout = 120

[source.login_body]                         # что отправить при входе; {env:…} — из переменных окружения
login = "{env:SK_LOGIN}"
password = "{env:SK_PASSWORD}"

[hearings]
source_name = "Судебный календарь"
full_snapshot = true                        # выгрузка полная: исчезнувшие из календаря помечаются в рабочем месте
ext_uid = "{uid}"
date = "{date}"
time = "{time|default:}"
court = "{court|default:}"
judge = "{judge|default:}"
case_text = "{case|default:}"
plaintiff = "{plaintiff|default:}"
defendant = "{defendant|default:}"
owners = "{owners|join}"
notes = "{note2|default:} {note3|default:}"
highlight = "{highlight|default:}"
