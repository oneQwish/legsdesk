# =============================================================================================
# ПРИМЕР: дела и значения полей из CSV-файла (например, отчёт, выгруженный из 1С или Excel).
#
# Как пользоваться:
#   1. Скопируйте файл, назовите по смыслу (например, «отчёт_юристов.toml»).
#   2. Поправьте путь к файлу и названия колонок в фигурных скобках {…}.
#   3. Проверьте:  python lawdesk_connect.py проверить отчёт_юристов.toml
#   4. Запустите:  python lawdesk_connect.py запустить отчёт_юристов.toml
# Строки, начинающиеся с «#», — комментарии, программа их не читает.
# =============================================================================================

[connector]
name = "Отчёт юристов (CSV)"              # название — так подключение видно в журналах
api_url = "http://127.0.0.1:8000"         # адрес рабочего места
api_key_env = "LAWDESK_KEY"               # ключ берётся из переменной окружения с этим именем
# api_key_file = "ключ.txt"               # …или из файла (одна строка с ключом). Файл не кладите в git!
direction = "in"                          # in — данные В рабочее место

[source]
type = "csv"
path = "данные/дела.csv"                  # путь от папки, где лежит этот файл настроек
encoding = "utf-8-sig"                    # выгрузки 1С/Excel обычно utf-8-sig или cp1251
delimiter = ";"                           # разделитель колонок; если не указать — угадается

# Необязательно: брать только нужные строки
[[source.only_if]]
column = "Статус"
not_in = ["Удалено", "Черновик"]

# ---- Дело: как найти/создать дело по строке -------------------------------------------------
# Дело ищется по УИД, а если его нет — по коду суда + номеру дела (в т.ч. по старым номерам и М-…).
[cases]
uid = "{УИД}"
court_code = "{Код суда}"
court_name = "{Суд}"
case_number = "{Номер дела|trim}"
aliases = "{Номер материала}"            # другие номера через «;» (М-…, прежний 2-…)
legal_entity = "{Ответчик|map:entities}" # значение переводится по таблице [maps.entities] ниже
building = "{Корпус}"
flat = "{Квартира}"
plaintiffs = "{Истцы}"
responsible = "{Ответственный|lower}"

# ---- Значения полей: что сообщает этот источник ----------------------------------------------
# Каждое поле — «наблюдение источника». Если источники расходятся, юрист увидит конфликт.
[observations]
source = "отчёт"                         # имя источника (1С, отчёт, OCR, письмо, …) — как его увидят юристы
source_ref = "строка {№}"                # ключ строки в источнике: повторная загрузка обновит, а не задвоит

[observations.fields]                    # слева — поле рабочего места, справа — колонка источника
judge = "{Судья}"
decision_date = "{Дата решения|date:%d.%m.%Y}"
claim_total = "{Заявлено|money}"
amount_debt = "{Основной долг|money}"
amount_penalty = "{Неустойка|money}"
amount_fine = "{Штраф|money}"
amount_moral = "{КМВ|money}"

# ---- Таблицы перевода значений -----------------------------------------------------------------
# Имя таблицы — ЛАТИНИЦЕЙ (так требует формат TOML): [maps.entities], а не [maps.юрлица]
[maps.entities]
"ООО «Главстрой-Саввино»" = "ГС-Саввино"
"ООО «Главстрой-СПб»" = "ГС-СПб"
"*" = "не определено"                     # «*» — для всех остальных значений
