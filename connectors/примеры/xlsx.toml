# =============================================================================================
# ПРИМЕР: реестр дел из Excel (.xlsx). Отличие от CSV — лист и даты.
# Excel хранит даты числом; перечислите такие колонки в date_columns — они станут датами.
# =============================================================================================

[connector]
name = "Реестр из Excel"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"
direction = "in"

[source]
type = "xlsx"
path = "данные/реестр.xlsx"
sheet = "Дела"                           # имя листа; если не указать — первый лист
skip_rows = 0                            # сколько строк пропустить до строки заголовков
date_columns = ["Дата решения"]

[cases]
uid = "{УИД}"
court_code = "{Код суда}"
court_name = "{Суд}"
case_number = "{Номер дела}"
legal_entity = "{Юрлицо}"

[observations]
source = "реестр Excel"
source_ref = "{Номер дела}"

[observations.fields]
judge = "{Судья}"
decision_date = "{Дата решения}"
outcome = "{Исход}"
