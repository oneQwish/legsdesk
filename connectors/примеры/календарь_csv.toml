# =============================================================================================
# ПРИМЕР: производственный календарь из CSV (все дни года: дата + вид дня).
# Нужен для правильного переноса процессуальных сроков с выходных и праздников.
# Требование: в файле ВЕСЬ год (365/366 строк). Загружается целиком, сроки пересчитываются сразу.
# Как выгрузить из 1С — docs/api-для-1с.md, раздел «Производственный календарь».
# =============================================================================================

[connector]
name = "Производственный календарь (CSV)"
api_url = "http://127.0.0.1:8000"
api_key_env = "LAWDESK_KEY"              # ключу нужна область calendar
direction = "in"

[source]
type = "csv"
path = "данные/календарь_2027.csv"
delimiter = ";"

[calendar]
date = "{Дата|date:%d.%m.%Y}"
day_type = "{ВидДня}"
nonworking_values = ["Суббота", "Воскресенье", "Праздник", "Нерабочий"]   # какие виды дня — нерабочие
source_name = "1С: регламентированный календарь"
