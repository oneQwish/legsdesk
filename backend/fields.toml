# =============================================================================================
# Справочник полей дела, которые сверяются по источникам (1С, отчёт, OCR, письмо, …).
#
# Как добавить поле (например, «Расходы на юриста»):
#   1. Допишите блок по образцу ниже. Ключ в [field.ключ] — латиницей, без пробелов, навсегда:
#      по нему поле передают коннекторы и выгрузки. Подпись (label) можно менять когда угодно.
#   2. Перезапустите сервер (docker compose restart backend).
#   3. В коннекторе укажите новое поле в [observations.fields]:  lawyer_fee = "{Расходы на юриста|money}"
#
# Типы (kind): text — текст, money — сумма (сравнивается до копейки, участвует в «присуждено»),
#              date — дата, list — список через «;» (порядок не важен, например истцы).
# Порядок блоков = порядок полей в карточке дела. group — заголовок группы в карточке.
# Удалять поле, по которому уже есть данные, не нужно — просто перестаньте его присылать.
# =============================================================================================

