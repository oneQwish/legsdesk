# --- Моратории и ограничения ставки ---------------------------------------------------------
# rule = "no_accrual" — в эти дни неустойка не начисляется;
# rule = "rate_cap"   — ставка не выше rate_cap_value (ставка на rate_cap_date).
[[moratorium]]
from = "2020-04-03"
to = "2020-12-31"
rule = "no_accrual"
act = "ПП РФ от 02.04.2020 № 423"

[[moratorium]]
from = "2022-02-25"
to = "2022-03-28"
rule = "rate_cap"
rate_cap_value = 9.5
rate_cap_date = "2022-02-25"
act = "ПП РФ от 26.03.2022 № 479, п. 2 (ред. ПП № 890) — сверить 9,5 %"

[[moratorium]]
from = "2022-03-29"
to = "2023-06-30"
rule = "no_accrual"
act = "ПП РФ от 26.03.2022 № 479 (ред. ПП № 1732)"

[[moratorium]]
from = "2023-07-01"
to = "2024-03-21"
rule = "rate_cap"
rate_cap_value = 7.5
rate_cap_date = "2023-07-01"
act = "ПП РФ от 18.03.2024 № 326, п. 2"

[[moratorium]]
from = "2024-03-22"
to = "2025-12-31"
