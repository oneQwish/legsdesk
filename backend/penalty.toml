# ================================================================================================
#  Калькулятор неустойки за просрочку передачи объекта долевого строительства (ч. 2 ст. 6 214-ФЗ)
# ================================================================================================
#  ВАЖНО: файл заполнен по справке от 25.10.2026, первоисточники (cbr.ru, pravo.gov.ru) при подготовке
#  были недоступны. Перед использованием в работе юрист сверяет:
#    - ряд ключевой ставки с https://www.cbr.ru/hd_base/KeyRate/ (особенно 2020–2024);
#    - тексты постановлений о мораториях и ограничении ставки (п. 2 ПП № 479 ред. № 890 — 9,5 %;
#      п. 2 ПП № 326 — 7,5 %), их продления;
#    - позицию о том, какая ставка берётся, если срок передачи пришёлся на мораторий.
#  Расчёт — подсказка для юриста, а не позиция по делу: суд может снизить неустойку (ст. 333 ГК).
#  После правки: docker compose restart backend. Новая ставка ЦБ — добавьте строку [[key_rate]] в конец.
# ================================================================================================

[penalty]
fraction = 300              # 1/300 ставки за каждый день просрочки
citizen_multiplier = 2      # участник — гражданин: в двойном размере (фактически 1/150)
rate_on = "due_date"        # ставка на день исполнения обязательства по договору (последний день срока передачи)
count_end_day = true        # включать ли день фактической передачи в период просрочки
law = "ч. 2 ст. 6 Федерального закона № 214-ФЗ"

[fine]
# Штраф: 50 % (п. 6 ст. 13 ЗоЗПП) или 5 % (ч. 3 ст. 10 214-ФЗ в ред. 266-ФЗ) — по дате, когда истёк срок
# добровольного удовлетворения требования (Постановление КС от 14.04.2026 № 24-П).
old_percent = 50
new_percent = 5
new_from = "2024-09-01"
# если срок добровольного удовлетворения истёк в эти периоды — штраф не взыскивается (моратории)
no_fine_periods = [["2022-03-29", "2023-06-30"], ["2024-03-22", "2025-12-31"]]

# --- Ключевая ставка Банка России (= ставка рефинансирования с 01.01.2016), % годовых ----------
