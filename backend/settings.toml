# ================================================================================================
#  Рабочее место юриста — настройки
# ================================================================================================
#  Здесь значения по умолчанию. Меняйте нужное, остальное можно оставить или удалить строку —
#  тогда действует то же значение из программы.
#
#  Применяются после перезапуска:  docker compose restart backend
#  Проверить файл и увидеть итог: docker compose exec backend python -m app.cli настройки
#
#  Пароли и ключи сюда НЕ пишутся (сервер откажется стартовать) — они в файле .env:
#    LAWDESK_SECRET_KEY, LAWDESK_DATABASE_URL, LAWDESK_DOCFLOW_PASSWORD, LAWDESK_DEV_PASSWORD.
#  Любую настройку можно переопределить и переменной окружения: LAWDESK_<ИМЯ>, например
#  LAWDESK_AUTH_MODE=dev на пробном компьютере. Переменная главнее этого файла.
#
#  Запись: текст — в кавычках, числа и true/false — без кавычек, списки — в [ ].
#  Опечатка в имени — сервер не стартует и подскажет правильное (текст в docker compose logs backend).
# ================================================================================================

[server]
# Часовой пояс компании: от него считается «сегодня» — просрочки, «сроки на сегодня», неделя
timezone = "Europe/Moscow"
# Папка собранного интерфейса, если сервер отдаёт его сам (в Docker интерфейс отдаёт nginx — оставьте пустым)
frontend_dist = ""
# Как часто выполняются действия «по дате» (вступление в силу, напоминания, еженедельный отчёт), минут
upkeep_interval_minutes = 60
# Адрес рабочего места для ссылок в письмах и отчётах, например "https://lawdesk.company.local"
public_url = ""

[auth]
# Вход: "ldap" — доменной учётной записью (рабочий режим); "dev" — без пароля AD, только для пробы
auth_mode = "ldap"
# Сколько часов действует вход, потом нужно войти снова
session_hours = 12
# Отдавать cookie входа только по HTTPS (в Docker включается автоматически)
cookie_secure = false
# Защита от подбора пароля: после стольких неудачных попыток подряд вход с этого компьютера
# для этого логина закрывается на login_lockout_minutes минут
login_max_failures = 5
login_lockout_minutes = 15
# Только для режима dev: роль по умолчанию и роли отдельных логинов ("ivanova=lawyer,petrov=viewer")
dev_role = "admin"
dev_roles = ""

[ldap]
# Контроллер домена: ldaps://… (рекомендуется) или ldap://…
ldap_url = "ldaps://dc.example.local"
# NetBIOS-имя домена (вход как ДОМЕН\логин) и где искать пользователей
ldap_domain = "EXAMPLE"
ldap_base_dn = "DC=example,DC=local"
# Группы AD → роли (DN группы целиком или его начало «CN=…»)
ldap_group_admin = "CN=Lawdesk-Admins"
ldap_group_lawyer = "CN=Lawdesk-Lawyers"
ldap_group_viewer = "CN=Lawdesk-Viewers"
# Сколько секунд ждать контроллер: соединение и ответ
ldap_connect_timeout = 5
ldap_receive_timeout = 10

[storage]
# Где хранить файлы документов: "local" (на сервере) или "docflow" (1С:Документооборот / другая система)
storage_backend = "local"
# Папка локального хранилища (в Docker — том storage)
storage_dir = "./storage"
# HTTP-сервис документооборота и пользователь (пароль — LAWDESK_DOCFLOW_PASSWORD в .env)
docflow_url = ""
docflow_user = ""
# Сколько секунд ждать документооборот при загрузке и чтении файла
docflow_timeout = 120
# Наибольший размер загружаемого документа, МБ (не больше client_max_body_size в frontend/nginx.conf)
max_upload_mb = 200
# Какие файлы открываются прямо в браузере; остальные — только скачиванием.
# HTML и SVG не добавляйте: в них может быть скрипт, который выполнится от имени юриста.
inline_mime = ["application/pdf", "image/png", "image/jpeg", "image/gif", "image/webp", "image/tiff", "text/plain"]

[values]
# Надёжность источников, от самого надёжного: когда источники согласны, показывается значение
# более надёжного. Названия — как приходят из коннекторов (поле source); не перечисленные — в конце.
source_trust = ["ручной", "письмо", "1С", "отчёт", "OCR"]

[deadlines]
# Срок считается «скоро» (жёлтая метка, счётчик «на неделю»), если до него не больше стольких дней
soon_days = 7
# Проверка загружаемого производственного календаря: столько нерабочих дней в году допустимо
# (меньше или больше — похоже на неполные данные, загрузка отклоняется)
calendar_min_nonworking = 100
calendar_max_nonworking = 140
# Праздники запасного календаря (ст. 112 ТК, «ММ-ДД») — когда год не загружен из 1С; без переносов
fallback_holidays = ["01-01", "01-02", "01-03", "01-04", "01-05", "01-06", "01-07", "01-08",
                     "02-23", "03-08", "05-01", "05-09", "06-12", "11-04"]

[limits]
# Сколько элементов сервис может прислать за один запрос (дела, значения, документы)
ingest_max_batch = 1000
# Наибольший размер страницы списков (дела, документы, задачи)
page_size_max = 500
# …очереди конфликтов, журнала, ленты изменений для внешних систем, списка сроков
conflicts_page_max = 200
journal_page_max = 1000
feed_limit_max = 5000
deadlines_limit_max = 5000
# Сколько последних событий показывать в журнале дела
case_events_limit = 500
# Сколько значений показывать в каждом фильтре (суды, судьи…)
facet_limit = 200
# Сколько событий нумеровать в ленте изменений за один проход (служебное)
feed_sequence_batch = 50000

[notify]
# Куда, кроме колокольчика в системе, отправлять уведомления: ["inapp"] — только в системе;
# ["inapp", "email"] — ещё и письмом (адрес — из AD). Пароль почты — LAWDESK_SMTP_PASSWORD в .env
notify_channels = ["inapp"]
# За сколько дней до срока напомнить ответственному (и ещё раз — в день срока)
deadline_remind_days = 3
# Почтовый сервер компании (нужен, только если включён канал email)
smtp_host = ""
smtp_port = 25
smtp_user = ""
smtp_from = "lawdesk@company.local"
smtp_tls = false

[documents]
# Папка шаблонов печатных форм (.docx); пусто — backend/forms
forms_dir = ""
# Куда складывать еженедельные отчёты; когда их делать: день недели (1 — понедельник … 7) и час
reports_dir = "./reports"
report_weekday = 1
report_hour = 8

[enforcement]
# Срок предъявления исполнительного листа к исполнению, лет (ст. 21 Закона № 229-ФЗ)
writ_presentation_years = 3
# Файл ставок и мораториев для калькулятора неустойки 214-ФЗ; пусто — backend/penalty.toml
penalty_file = ""

[tasks]
# Сколько секунд сервис держит взятую задачу, если не продлил её (потом её может взять другой)
task_default_lease_seconds = 600

[interface]
# «Стол»: лента дней (сколько дней по умолчанию и наибольшее)
desk_strip_days = 14
desk_strip_max_days = 62
# «Стол»: стопка «Горят сроки» — сроки на столько дней вперёд; «Сроки на неделю» — до стольких дней
desk_hot_days = 3
desk_week_days = 10
# Сколько дел в одной стопке на «Столе»
desk_pile_size = 60
# Страница «Сроки»: сколько сроков загружать и сколько строк в группе до «показать все»
deadlines_page_limit = 2000
deadlines_group_limit = 150
# «Моя неделя»: цели по умолчанию (каждый юрист может поменять свои, щёлкнув по числу)
goal_conflicts = 50
goal_deadlines = 20
goal_documents = 20
