# Развёртывание на сервере в сети компании:  cp .env.example .env  (заполнить)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawdesk
      POSTGRES_USER: lawdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawdesk"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      LAWDESK_DATABASE_URL: postgresql+psycopg://lawdesk:${POSTGRES_PASSWORD}@db:5432/lawdesk
      LAWDESK_COOKIE_SECURE: "true"
      LAWDESK_BACKUP_STATUS_FILE: /backups/status.json   # итог последней копии — для страницы администратора
    volumes:
      - storage:/data/storage   # локальное хранилище файлов, пока не подключён 1С:Документооборот
      - backups:/backups:ro     # резервные копии: сервер только читает status.json
      - ./backend/fields.toml:/app/fields.toml:ro       # справочник полей: правка + docker compose restart backend
      - ./backend/settings.toml:/app/settings.toml:ro   # настройки: правка + docker compose restart backend
      - ./backend/forms:/app/forms                      # шаблоны печатных форм (загружаются из интерфейса)
    healthcheck:   # /api/health отвечает 503, если недоступна база
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  # Резервные копии: каждый день в BACKUP_TIME — дамп базы + архив файлов документов, проверка
  # восстановления, прореживание старых. Копии — в томе backups (docs/администрирование.md, раздел 4).
  # Том лежит на этом же сервере: копии нужно дополнительно увозить на другой сервер (пример rsync — там же).
  # Сделать копию сейчас: docker compose exec backup backup.sh now
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}   # чтобы psql/pg_restore работали и при ручном запуске (восстановление)
      TZ: Europe/Moscow
      BACKUP_TIME: "02:30"          # когда делать копию
      BACKUP_MIN_FREE_MB: "2048"    # меньше свободного места — копия не делается (ошибка в админке)
    volumes:
      - backups:/backups
      - storage:/data/storage:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  backups:
